<!doctype html>

<html>
    <head>
        <title><%= htmlWebpackPlugin.options.title %></title>
    </head>
    <body>
        <div id="push-embed"></div>
        <script type="module">
            import {
                DataService,
                PresetService,
                PushSummaryComponent,
                PushTableComponent,
                embed,
            } from 'https://www.matt-herold.de/ml-push/standalone.js'

            document.addEventListener('DOMContentLoaded', (event) => {
                let dataService = new DataService()

                let presetService = new PresetService()
                presetService.load(dataService, 'default')

                dataService.groupColumns = ['date']
                dataService.rollup = { value: 'op.sum(d.value)' }

                let totals = embed(PushSummaryComponent, dataService, {
                    title: 'Zusammenfassung',
                    benchmarkTitle: 'Groups',
                })

                document.getElementById('push-embed').appendChild(totals)
            })
        </script>
    </body>
</html>
