<!doctype html>

<html>
    <head>
        <title><%= htmlWebpackPlugin.options.title %></title>
        <script type="module">
            import {
                DataService,
                PresetService,
                PushSummaryComponent,
                PushHistoryComponent,
                pushEmbed,
            } from './standalone.js'

            document.addEventListener('DOMContentLoaded', (event) => {
                let dataService = new DataService()

                let presetService = new PresetService()
                presetService.load(dataService, 'default')

                dataService.groupColumns = ['date', 'group']
                dataService.rollup = { value: 'op.sum(d.value)' }

                let componentDiv = pushEmbed(PushHistoryComponent, dataService, {
                    title: 'Zusammenfassung',
                    benchmarkTitle: 'Groups',
                })
console.log(componentDiv);
                document.getElementById('widget').appendChild(componentDiv)
            })
        </script>
    </head>
    <body>
        <div class="push">
            <div style="padding: 16px">
                <div class="prose pt-4 pb-2">
                    <h1 class="">Totals</h1>
                </div>
                <div class="grid grid-cols-1">
                    <div id="widget"></div>
                </div>
            </div>
        </div>
    </body>
</html>
