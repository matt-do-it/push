<!doctype html>

<html>
    <head>
        <title>Standalone</title>
        <script type="module">
            import {
                DataService,
                PresetService,
                PushSummaryComponent,
                PushTableComponent,
                embed,
            } from './standalone.js'

            document.addEventListener('DOMContentLoaded', (event) => {
                let dataService = new DataService()

                let presetService = new PresetService()
                presetService.load(dataService, 'default')

                dataService.groupColumns = ['date']
                dataService.rollup = { value: 'op.sum(d.value)' }

                let totals = embed(PushSummaryComponent, dataService, {
                    title: 'Zusammenfassung',
                    benchmarkTitle: 'Groups',
                })

                document.getElementById('totals').appendChild(totals)
            })
        </script>
    </head>
    <body>
        <div class="push">
            <div style="padding: 16px">
                <div class="prose pt-4 pb-2">
                    <h1 class="">Totals</h1>
                </div>
                <div class="grid grid-cols-1">
                    <div id="totals"></div>
                </div>
            </div>
        </div>
    </body>
</html>
